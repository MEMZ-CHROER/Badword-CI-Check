name: Badword Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  badword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./   # dogfood：用 action.yml 引用自身
        with:
          base: ${{ github.event.pull_request.base.sha }}
      - name: 运行自测
        run: bash test/run-tests.sh
